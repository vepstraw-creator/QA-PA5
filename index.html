<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Forms</title>

    <link rel="stylesheet" type="text/css href=style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body style="background-color: rgb(136, 167, 213);">

    <div class="container bg-warning text-white rounded p-5 mt-5">

           <form action="" method="post">

                <h2>Custom Sneaker Order Form</h2>

                <div class="form-group">
                       <label for="form-name" class="for-label">Name:</label> 
                <input type="text" name="username" id="form-name" class="textinput form-control">
                </div>

                <div class="form-group">
                    <label for="form-email" class="for-label">Email:</label> 
                    <input type="email" name="emailaddress" id="form-email"class="textinput form-control">
                </div>

                <div class="from-group">
                    <label for="form-tel" class="for-label">Telephone:</label> 
                    <input type="tel" name="telephone" id="form-tel"class="textinput form-control">
                </div>

                <div class="form-group">
                    <label for="form-story" class="for-label">Tell us about yourself:</label> 
                    <textarea name="story" maxlength="600" id="form-story" placeholder="No more than 600 characters long" class=""></textarea>
                </div>
           

                
                
                <label for="sizes" class="for-label">Size:</label>
                <select name="size" id="sizes" class="form-select">
                    <option>5</option>
                    <option>6</option>
                    <option>7</option>
                    <option>8</option>
                    <option>9</option>
                    <option>10</option>
                    <option>11</option>
                    <option>12</option>
                    <option>13</option>
                </select> 
                
                <em>Sizes reflect standard US men's sizes</em>
                    
                <label for="colors">Sneaker Color:</label>
                <fieldset id="colors">

                    <legend>Color</legend>

                    <div class="form-check">
                            <label class="form-check-label">
                                <input type="radio" name="color" value="red" class="form-check-input"> Red 
                            </label>
                    </div>

                    <div class="form-check">
                            <label class="form-check-label">
                                <input type="radio" name="color" value="red" class="form-check-input"> Blue
                            </label>

                    </div>

                    <div class="form-check">
                            <label class="form-check-label">
                                <input type="radio" name="color" value="black" class="form-check-input"> Black
                            </label> 
                    </div>

                    <div class="form-check">
                            <label class="form-check-label">
                                <input type="radio" name="color" value="silver" class="form-check-input"> Silver
                            </label>
                    </div>

                    
                   
                    
                    
                </fieldset>
                    
                <label for="features">Add-on Features:</label>
                <fieldset id="features">
                    <legend>Feature</legend>

                    <div class="form-checks">

                    </div>


                    <label><input type="checkbox" name="feature" value="laces"> Sparkley laces</label>
                    <label><input type="checkbox" name="feature" value="logo" checked> Metallic logo</label>
                    <label><input type="checkbox" name="feature" value="heels"> Light-up heels</label>
                    <label><input type="checkbox" name="feature" value="mp3"> MP3-enabled</label>
                </fieldset>
                    
                <input type="submit" value="ENTER">
                <button type="button" class="btn btn-info mt-5">


                </button>

           </form>
    </div>

 
</body>
</html>
